<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
</head>
<body>
    <div class="tareas">
        <center><h2 class="titulo">Tareas</h2>
    
        <input type="text" id="tareaInput" placeholder="Ingrese una tarea">
        <button id="agregarTareaBtn">Agregar Tarea</button>
        </center>
        <ul id="listaTareas"></ul>
        
    </div>
    
    <script>
        const tareaInput = document.getElementById('tareaInput');
        const agregarTareaBtn = document.getElementById('agregarTareaBtn');
        const listaTareas = document.getElementById('listaTareas');

        agregarTareaBtn.addEventListener('click',() => {
            const tarea = tareaInput.value.trim();
            if (tarea) {
                const li = document.createElement('li');
                li.textContent = tarea;
                listaTareas.appendChild(li);
                tareaInput.value = '';
            }
        });
    </script>
    <style>
        body {
            background-color: #fcfafa;
        }
        .titulo {
            font-family: 'Times New Roman', Times, serif;
            color: #ffdd00;
            border-radius: 10px;
        }
        .tareas {
            font-family: 'Times New Roman', Times, serif;
            max-width: 400px;
            margin: 50px auto;
            min-height: 300px auto;
            padding: 20px auto; 
            background-color: #0000ff77;
            border: 2px solid #ffdd00;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            border: 2px solid #ffdd00;
            border-radius: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #ffdd00;
            color: #000000;
            border: 2px solid #ffdd00;
            border-radius: 10px;
            cursor: pointer;
        }
        ul {
            margin: 20px;
            background-color: #fbfbfc77;
            list-style-type: none;
            padding-left: 0;
            border-radius: 10px;
        }
        li {
            padding: 10px 0;
            color: #000000;
            border-radius: 10px;
        }
    </style>
</body>
</html>
