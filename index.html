<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="tareas">
        <center><h1>Tareas</h1>
    
        <input type="text" id="tareaInput" placeholder="Ingrese una tarea">
        <button id="agregarTareaBtn">Agregar Tarea</button>
        <ul id="listaTareas"></ul>
        </center>
    </div>
    
    <script>
        const tareaInput = document.getElementById('tareaInput');
        const agregarTareaBtn = document.getElementById('agregarTareaBtn');
        const listaTareas = document.getElementById('listaTareas');

        agregarTareaBtn.addEventListener('click', () => {
            const tarea = tareaInput.value.trim();
            if (tarea) {
                const li = document.createElement('li');
                li.textContent = tarea;
                listaTareas.appendChild(li);
                tareaInput.value = '';
            }
        });
    </script>
    <style>
        .tareas {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            background-color: #f3f1e4;
        }
        input {
            padding: 5px;
            margin-right: 10px;
        }
        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {

            padding: 5px 0;
        }
    </style>
</body>
</html>
